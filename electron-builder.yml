appId: com.dynamicisland.widget
productName: 灵动岛挂件
copyright: Copyright © 2026

directories:
  output: release
  buildResources: electron

# 打包内容:挂件页面 + Electron 侧脚本(不含演示页面与源码)
# 注意:main.cjs 顶层 require 的每个 .cjs 都要列进来——漏一个打包版
# 启动就报 "Cannot find module"(2026-08-07 实测:settings-store.cjs /
# screenshot-tests.cjs 曾漏列,安装版启动即崩)
files:
  - dist-widget/**/*
  - electron/main.cjs
  - electron/preload.cjs
  - electron/bridge.cjs
  - electron/agent.cjs
  - electron/settings-store.cjs
  - electron/screenshot-tests.cjs
  - electron/icon.png
  - package.json

# 桥接的 PowerShell 读取脚本与 C# 桥接源码放 asar 外
# (asar 内文件无法被 powershell/csc 直接打开)
extraResources:
  - from: electron/smtc-reader.ps1
    to: bridge/smtc-reader.ps1
  - from: electron/smtc-bridge.cs
    to: bridge/smtc-bridge.cs
  # 内置工具(2026-08-07 随包发行):**仅 bili-tool 打进安装包**(用户要求;
  # xxt/DocFlow 不随包,引擎在打包版缺失时回退 dev 源码 + 系统 Python)。
  # bili 是纯 Rust 单二进制零依赖,放 asar 外——引擎 spawn 可执行文件,
  # asar 内无法直接执行;登录态/下载落点经 BILI_BASE_DIR / cwd 指向
  # userData(安装目录只读,base_dir 已支持环境变量覆盖)
  - from: tools/bili
    to: tools/bili

# 直接复用本地已解压的 Electron(跳过 zip 下载/解压;
# 安全软件实时监控会锁住新解压的 electron.exe 导致目录重命名失败)
electronDist: node_modules/electron/dist

# 桥接进程避免从 asar 内 fork(解包到磁盘更稳)
asarUnpack:
  - electron/bridge.cjs

win:
  icon: electron/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: 灵动岛挂件
  artifactName: 灵动岛挂件-安装版-${version}.${ext}
  # 卸载时**选择是否保留数据**(用户要求,2026-08-06):electron-builder
  # 26 的 deleteAppDataOnUninstall 确认卸载即删、无勾选框,已关闭——
  # 改由 nsis-custom.nsi 的卸载页面(「保留我的数据」复选框,默认勾选)
  # + customUnInstall 条件删除接管(%APPDATA%\dynamic-island:
  # settings.json / localStorage / 长期记忆 / 技能 / 上传音乐·背景·字体)
  deleteAppDataOnUninstall: false
  # 自定义 NSIS 脚本:安装向导视觉定制(整窗背景图/透明化标签/欢迎页
  # 文案/卸载数据保留选择页面)+ 开始菜单「卸载」快捷方式(需 UTF-8
  # BOM——NSIS include 按 BOM 检测编码,无 BOM 的 UTF-8 中文在 GBK
  # 系统报 "Bad text encoding")
  include: electron/nsis-custom.nsi
  # 安装向导整窗背景图:electron/installer-bg.bmp(800×533 24bit BMP,
  # 由 scripts/gen-installer-bg.mjs 从项目根 bg.png 生成,更换背景图后
  # 重跑 pnpm gen:installer-bg)——NSIS 侧 onGUIInit 经 LoadImage 按
  # 客户区尺寸拉伸铺满全部向导页面,标签/头部/品牌条全透明
  # (MUI_BGCOLOR transparent + MUI_TEXTCOLOR 深色文字,图偏浅)

portable:
  artifactName: 灵动岛挂件-便携版-${version}.${ext}

npmRebuild: false
