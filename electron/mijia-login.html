<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>米家扫码登录</title>
<style>
  /* 米家扫码登录小窗(2026-09-22 建,视觉对齐 napcat-login):
     ① 服务端 QR 图源直显(权威码源),图源失败回退手编矩阵画 loginUrl;
     ② 三态可视:加载中占位 / 二维码 / 错误占位;
     ③ 倒计时条随剩余时间转色(充裕蓝 → 紧张橙 → 临期红呼吸)。 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: rgb(8, 10, 14);
    color: #fff;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 18px 12px;
    user-select: none;
    -webkit-app-region: drag;
  }
  button, input, select { -webkit-app-region: no-drag; }

  /* ── 头部:品牌行 + 状态徽标 + 自绘窗口控件 ─────────── */
  .head { display: flex; align-items: center; gap: 8px; width: 100%; max-width: 330px; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; flex: none;
    background: linear-gradient(135deg, rgba(255,103,29,0.28), rgba(255,103,29,0.10));
    border: 1px solid rgba(255,103,29,0.35);
    display: flex; align-items: center; justify-content: center; font-size: 17px;
  }
  .titles { flex: 1; min-width: 0; }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; white-space: nowrap; }
  .sub {
    font-size: 10.5px; color: rgba(255,255,255,0.42); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .winctl { display: flex; gap: 2px; flex: none; }
  .wc {
    width: 30px; height: 26px; border: none; background: transparent;
    color: rgba(255,255,255,0.55); border-radius: 7px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, color 0.15s, transform 0.1s;
  }
  .wc svg { width: 11px; height: 11px; display: block; }
  .wc svg path { stroke: currentColor; stroke-width: 1.2; fill: none; stroke-linecap: round; }
  .wc:hover { background: rgba(255,255,255,0.12); color: #fff; }
  .wc:active { transform: scale(0.9); }
  .wc-close:hover { background: #e81123; color: #fff; }
  .chip {
    flex: none; display: flex; align-items: center; gap: 6px;
    font-size: 10.5px; color: rgba(255,255,255,0.65);
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 999px; padding: 4px 10px;
  }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #6b7280; }
  .chip.wait .dot { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.7); }
  .chip.busy .dot { background: #fbbf24; box-shadow: 0 0 6px rgba(251,191,36,0.7); }
  .chip.ok .dot { background: #4ade80; box-shadow: 0 0 8px rgba(74,222,128,0.9); }
  .chip.err .dot { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.7); }
  .chip.load .dot { background: #7aa0ff; animation: breathe 1.2s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: 0.25; } }

  .tip {
    margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.45);
    text-align: center; line-height: 1.6; max-width: 300px;
  }
  .tip b { color: rgba(255,255,255,0.75); font-weight: 600; }

  /* ── 二维码卡片(加载 / 码 / 错误 三态)─────────────── */
  .qr-card {
    margin-top: 14px;
    background: #fff;
    border-radius: 16px;
    padding: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
    position: relative;
    width: 256px; height: 256px;
    display: flex; align-items: center; justify-content: center;
  }
  #qrImg { display: none; width: 232px; height: 232px; border-radius: 4px; }
  #qrImg.show { display: block; }
  #qr { display: none; width: 232px; height: 232px; image-rendering: pixelated; }
  #qr.show { display: block; }

  .placeholder {
    position: absolute; inset: 12px;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; color: #444; text-align: center; padding: 0 18px;
  }
  .placeholder.show { display: flex; }
  .spinner {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid rgba(255,103,29,0.18); border-top-color: #ff671d;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .placeholder .p-icon { font-size: 30px; line-height: 1; }
  .placeholder .p-title { font-size: 13px; font-weight: 600; color: #222; }
  .placeholder .p-desc { font-size: 11px; color: #888; line-height: 1.6; }
  .placeholder.err .p-title { color: #c0392b; }

  .veil {
    position: absolute; inset: 12px;
    background: rgba(255,255,255,0.95);
    border-radius: 12px;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .veil.show { display: flex; }
  .veil .check {
    width: 52px; height: 52px; border-radius: 50%;
    background: #e8f8ee; display: flex; align-items: center; justify-content: center;
  }
  .veil .check svg { width: 28px; height: 28px; }
  .veil .check path {
    stroke: #16a34a; stroke-width: 3.4; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 36; stroke-dashoffset: 36;
    animation: draw 0.5s 0.1s ease forwards;
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .veil .big { font-size: 15px; font-weight: 600; color: #0a7a3d; }

  /* ── 倒计时条 ───────────────────────────────────────── */
  .timer { width: 256px; margin-top: 12px; }
  .bar-wrap { height: 5px; background: rgba(255,255,255,0.10); border-radius: 3px; overflow: hidden; }
  #bar {
    height: 100%; width: 100%; border-radius: 3px;
    background: linear-gradient(90deg, #ff671d, #ff9a5c);
    transition: width 0.6s linear, background 0.4s;
  }
  #bar.warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
  #bar.danger { background: linear-gradient(90deg, #ef4444, #f87171); animation: breathe 1s ease-in-out infinite; }
  .timer-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: 6px; font-size: 10.5px; color: rgba(255,255,255,0.38);
  }
  #timerSec { font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.55); }

  /* ── 状态行 / 按钮 / 区域 ───────────────────────────── */
  .status {
    min-height: 36px; margin-top: 8px; font-size: 12px;
    color: rgba(255,255,255,0.72); text-align: center; line-height: 1.55;
    max-width: 300px; display: flex; align-items: center; justify-content: center;
  }
  .status.err { color: #ff9b9b; }
  .status.ok { color: #6ee7a0; }
  .actions { margin-top: 6px; display: flex; gap: 10px; align-items: center; }
  .btn {
    border: 1px solid rgba(255,255,255,0.22);
    background: rgba(255,255,255,0.08);
    color: #fff; font-size: 12px; border-radius: 999px;
    padding: 8px 18px; cursor: pointer;
    transition: background 0.18s, transform 0.12s, opacity 0.18s;
  }
  .btn:hover { background: rgba(255,255,255,0.15); }
  .btn:active { transform: scale(0.94); }
  .btn.primary {
    background: rgba(255,103,29,0.22); border-color: rgba(255,103,29,0.55);
  }
  .btn.primary:hover { background: rgba(255,103,29,0.34); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .region-row { margin-top: 4px; display: flex; gap: 8px; align-items: center; font-size: 11px; color: rgba(255,255,255,0.45); }
  .region-row select {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 8px; color: #fff; font-size: 11px;
    padding: 5px 8px; outline: none;
  }
  .hint {
    margin-top: 10px; font-size: 10px; color: rgba(255,255,255,0.32);
    text-align: center; line-height: 1.65; max-width: 300px;
  }
</style>
</head>
<body>
  <div class="head">
    <div class="logo">🐳</div>
    <div class="titles">
      <h1>米家扫码登录</h1>
      <div class="sub">小米账号 · 二维码到期自动换新</div>
    </div>
    <div class="chip load" id="chip"><span class="dot"></span><span id="chipText">连接中</span></div>
    <div class="winctl">
      <button class="wc" id="btnMin" title="最小化" aria-label="最小化"><svg viewBox="0 0 10 10"><path d="M1 5h8"/></svg></button>
      <button class="wc wc-close" id="btnClose" title="关闭" aria-label="关闭"><svg viewBox="0 0 10 10"><path d="M1.5 1.5l7 7M8.5 1.5l-7 7"/></svg></button>
    </div>
  </div>
  <div class="tip">用<b>米家 App</b>「扫一扫」,扫完在手机上确认登录<br>一直扫<b>屏幕上这张</b>即可,失效前会自动换新</div>

  <div class="qr-card">
    <img id="qrImg" alt="登录二维码">
    <canvas id="qr" width="232" height="232"></canvas>
    <div class="placeholder show" id="placeholder">
      <div class="spinner" id="pSpinner"></div>
      <div class="p-icon" id="pIcon" style="display:none">⚠️</div>
      <div class="p-title" id="pTitle">正在获取登录二维码…</div>
      <div class="p-desc" id="pDesc">连接小米账号服务</div>
    </div>
    <div class="veil" id="veil">
      <div class="check"><svg viewBox="0 0 28 28"><path d="M5 14.5 L11.5 21 L23 8"/></svg></div>
      <div class="big">登录成功</div>
    </div>
  </div>

  <div class="timer">
    <div class="bar-wrap"><div id="bar"></div></div>
    <div class="timer-row"><span>自动换新倒计时</span><span id="timerSec">--</span></div>
  </div>
  <div class="status" id="status">正在连接…</div>
  <div class="actions">
    <button class="btn primary" id="btnRefresh">换一张</button>
  </div>
  <div class="region-row">
    <span>区域</span>
    <select id="region">
      <option value="cn" selected>中国 cn</option>
      <option value="de">德国 de</option>
      <option value="us">美国 us</option>
      <option value="ru">俄罗斯 ru</option>
      <option value="tw">台湾 tw</option>
      <option value="sg">新加坡 sg</option>
      <option value="in">印度 in</option>
      <option value="i2">i2</option>
    </select>
  </div>
  <div class="hint">凭证经系统加密(DPAPI)保存在本机,不进对话/日志。<br>登录成功后本窗口自动关闭。</div>
<script>
  const $ = (id) => document.getElementById(id)
  const canvas = $('qr')
  const ctx = canvas.getContext('2d')
  const qrImg = $('qrImg')
  // 服务端图源加载失败 → 回退手编矩阵(画 loginUrl)
  qrImg.addEventListener('error', () => {
    qrImg.classList.remove('show')
    if (lastQr && lastQr.rows) drawQr(lastQr.rows)
  })
  let lastQr = null

  function drawQr(rows) {
    const size = rows.length
    const quiet = 3
    const total = size + quiet * 2
    const px = Math.floor(232 / total) || 1
    const dim = px * total
    canvas.width = dim
    canvas.height = dim
    ctx.fillStyle = '#fff'
    ctx.fillRect(0, 0, dim, dim)
    ctx.fillStyle = '#000'
    for (let r = 0; r < size; r++) {
      for (let c = 0; c < size; c++) {
        if (rows[r][c] === '1') ctx.fillRect((c + quiet) * px, (r + quiet) * px, px, px)
      }
    }
    canvas.classList.add('show')
    qrImg.classList.remove('show')
    $('placeholder').classList.remove('show')
  }

  function showImg(url) {
    canvas.classList.remove('show')
    qrImg.classList.add('show')
    if (qrImg.getAttribute('src') !== url) qrImg.setAttribute('src', url)
    $('placeholder').classList.remove('show')
  }

  function showPlaceholder(kind, title, desc) {
    canvas.classList.remove('show')
    qrImg.classList.remove('show')
    const ph = $('placeholder')
    ph.classList.add('show')
    ph.classList.toggle('err', kind === 'err')
    $('pSpinner').style.display = kind === 'load' ? '' : 'none'
    $('pIcon').style.display = kind === 'err' ? '' : 'none'
    $('pTitle').textContent = title
    $('pDesc').textContent = desc || ''
  }

  function setChip(cls, text) {
    const chip = $('chip')
    chip.className = 'chip ' + cls
    $('chipText').textContent = text
  }

  function setTimer(remain, ttl) {
    const total = ttl || 240
    const r = Math.max(0, remain | 0)
    const bar = $('bar')
    bar.style.width = Math.round((r / total) * 100) + '%'
    bar.className = r <= 20 ? 'danger' : r <= 60 ? 'warn' : ''
    $('timerSec').textContent = r + 's'
  }

  function render(s) {
    lastQr = s.qr || null
    // 权威码源 = 服务端 QR 图源;图源缺失/加载失败才回退矩阵
    if (s.phase === 'waiting' && s.qrImage) showImg(s.qrImage)
    else if (s.phase === 'waiting' && s.qr && s.qr.rows) drawQr(s.qr.rows)
    setTimer(s.remainSec, s.ttlSec)

    if (s.phase === 'done') {
      $('veil').classList.add('show')
      $('placeholder').classList.remove('show')
      setChip('ok', '已登录')
      $('status').textContent = '登录成功,窗口即将自动关闭'
      $('status').className = 'status ok'
      $('btnRefresh').disabled = true
    } else if (s.phase === 'error') {
      $('veil').classList.remove('show')
      showPlaceholder('err', '无法获取二维码', s.message || '出错了')
      setChip('err', '出错')
      $('status').textContent = s.message || '出错了'
      $('status').className = 'status err'
    } else if (s.phase === 'waiting' && (s.qrImage || (s.qr && s.qr.rows))) {
      $('veil').classList.remove('show')
      const remain = Math.max(0, s.remainSec | 0)
      if (s.message) {
        setChip('busy', '进行中')
        $('status').textContent = s.message + ' · ' + remain + ' 秒后自动换新'
      } else {
        setChip('wait', '等待扫码')
        $('status').textContent = '等待扫码 · ' + remain + ' 秒后自动换新'
      }
      $('status').className = 'status'
    } else {
      // waiting 但暂无码(启动中 / 换码间隙——过期码不落屏)
      showPlaceholder('load', '正在获取登录二维码…', '连接小米账号服务')
      setChip('load', '连接中')
      $('status').textContent = s.message || '正在连接…'
      $('status').className = 'status'
    }
  }

  window.mijiaLogin.onState(render)
  $('btnRefresh').addEventListener('click', () => window.mijiaLogin.refresh())
  $('btnMin').addEventListener('click', () => window.mijiaLogin.minimize())
  $('btnClose').addEventListener('click', () => window.mijiaLogin.close())
  $('region').addEventListener('change', () => window.mijiaLogin.start($('region').value))
  window.mijiaLogin.ready()
</script>
</body>
</html>
