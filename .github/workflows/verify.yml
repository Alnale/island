name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron 43 按需下载二进制；运行时检查直接启动 exe，须在干净环境先安装。
      - run: pnpm exec install-electron
      - run: pnpm check
      - run: pnpm build
      - run: pnpm build:electron
      - run: pnpm build:widget
